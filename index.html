                                                <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-300">${spec.label}</span>
                                                <span class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 font-medium sm:text-right">${spec.val}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="pt-4 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
                                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30">
                                        &larr; Kembali ke Ensiklopedia
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render PC Packages Recommendation View
        function renderPackages() {
            return `
                <div class="space-y-8">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="text-left space-y-2">
                            <span class="px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 text-xs font-semibold border border-indigo-500/30">Rekomendasi Ahli</span>
                            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white">Paket Rakitan PC Terbaik</h1>
                            <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400">Pilih tier rakitan PC yang sesuai dengan kebutuhan produktivitas dan anggaran Anda.</p>
                        </div>
                        <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-semibold rounded-xl transition self-start sm:self-auto">
                            &larr; Kembali ke Beranda
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        ${packagesData.map(pkg => `
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col justify-between shadow-xl transition-all hover:border-indigo-500/50">
                                <div class="space-y-6">
                                    <div class="flex items-center justify-between">
                                        <span class="px-3 py-1 text-xs font-bold rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20">${pkg.badge}</span>
                                        <span class="text-lg font-extrabold text-emerald-600 dark:text-emerald-400">${pkg.price}</span>
                                    </div>
                                    <div>
                                        <h3 class="text-2xl font-bold text-slate-900 dark:text-white">${pkg.title}</h3>
                                        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2">${pkg.desc}</p>
                                    </div>

                                    <div class="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <h4 class="text-xs font-bold text-slate-900 dark:text-slate-200 uppercase tracking-wider">Komponen Utama:</h4>
                                        <div class="space-y-2">
                                            ${pkg.parts.map(p => `
                                                <div class="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/40 text-xs flex flex-col">
                                                    <span class="font-semibold text-indigo-600 dark:text-indigo-300">${p.role}</span>
                                                    <span class="text-slate-700 dark:text-slate-200">${p.name}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Render PC Builder Simulator View
        function renderBuilder() {
            return `
                <div class="space-y-8">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest">Simulator Interaktif</span>
                            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">Simulasi Rakit Komputer</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Pilih komponen impian Anda dan cek estimasi total kebutuhan daya listrik.</p>
                        </div>
                        <button onclick="resetBuilder()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-xl transition">
                            Reset Rakitan
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div class="lg:col-span-8 space-y-4" id="builderSlots">
                            <!-- Injected by JS -->
                        </div>

                        <div class="lg:col-span-4 space-y-6">
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sticky top-24 space-y-6 shadow-2xl">
                                <h3 class="text-lg font-bold text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4">Ringkasan Rakitan</h3>
                                <div class="space-y-3 text-sm">
                                    <div class="flex justify-between text-slate-500 dark:text-slate-400">
                                        <span>Total Komponen:</span>
                                        <span id="summaryCount" class="font-bold text-slate-900 dark:text-white">0 / 5</span>
                                    </div>
                                    <div class="flex justify-between text-slate-500 dark:text-slate-400">
                                        <span>Estimasi Daya:</span>
                                        <span id="summaryPower" class="font-bold text-indigo-600 dark:text-indigo-400">0 Watt</span>
                                    </div>
                                    <div class="flex justify-between text-slate-500 dark:text-slate-400">
                                        <span>Rekomendasi PSU:</span>
                                        <span id="summaryPsuRec" class="font-bold text-emerald-600 dark:text-emerald-400">Minimal 500W</span>
                                    </div>
                                </div>
                                <button onclick="showToast('Rakitan berhasil disimpan & divalidasi!')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">
                                    Simpan & Validasi Rakitan
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render 10-Question Interactive Quiz View with Celebration Animation
        function renderQuiz() {
            return `
                <div class="max-w-2xl mx-auto space-y-8 py-4">
                    <div class="flex items-center justify-between">
                        <div class="space-y-1">
                            <span class="px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 text-xs font-semibold border border-indigo-500/30">Tantangan Pengetahuan Hardware</span>
                            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-1">Kuis Komputer 10 Soal</h1>
                        </div>
                        <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-semibold rounded-xl transition">
                            &larr; Beranda
                        </button>
                    </div>

                    <div id="quizContainer" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl relative overflow-hidden transition-colors duration-300">
                        <!-- Injected via JS -->
                    </div>
                </div>
            `;
        }

        function loadQuizQuestion() {
            const container = document.getElementById('quizContainer');
            if (!container) return;

            if (currentQuizIndex >= quizData.length) {
                const isPerfectScore = (score === quizData.length);
                container.innerHTML = `
                    <div class="text-center space-y-6 py-6">
                        ${isPerfectScore ? `
                            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-600/10 via-purple-600/10 to-emerald-600/10 pointer-events-none animate-pulse"></div>
                            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-500 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-extrabold shadow-xl">🏆</div>
                            <div class="space-y-2">
                                <h2 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-emerald-600 bg-clip-text text-transparent">JAWABAN KAMU BENAR SEMUA!</h2>
                                <p class="text-sm text-slate-600 dark:text-slate-300 font-medium">Luar biasa! Anda berhasil menjawab seluruh 10 soal kuis dengan sempurna tanpa satupun kesalahan. Anda adalah seorang PC Enthusiast sejati!</p>
                            </div>
                        ` : `
                            <div class="w-16 h-16 bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">🎉</div>
                            <div class="space-y-1">
                                <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Kuis Selesai!</h2>
                                <p class="text-slate-600 dark:text-slate-300 text-sm">Skor Anda: <span class="font-bold text-indigo-600 dark:text-indigo-400">${score}</span> dari ${quizData.length} soal.</p>
                            </div>
                        `}
                        <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">Ulangi Kuis</button>
                    </div>
                `;
                return;
            }

            const q = quizData[currentQuizIndex];
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between text-xs font-semibold text-indigo-600 dark:text-indigo-400">
                        <span>Pertanyaan ${currentQuizIndex + 1} dari ${quizData.length}</span>
                        <span>Skor Sementara: ${score}</span>
                    </div>
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">${q.q}</h3>
                    <div class="space-y-3 pt-2">
                        ${q.options.map((opt, idx) => `
                            <button onclick="checkQuizAnswer(${idx}, ${q.answer})" class="w-full text-left px-5 py-3.5 bg-slate-50 dark:bg-slate-800/70 hover:bg-indigo-50 dark:hover:bg-indigo-600/20 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 transition">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(selected, correct) {
            if (selected === correct) {
                score++;
                showToast("Jawaban Benar! 🎉");
            } else {
                showToast("Jawaban Kurang Tepat.");
            }
            currentQuizIndex++;
            loadQuizQuestion();
        }

        function resetQuiz() {
            currentQuizIndex = 0;
            score = 0;
            loadQuizQuestion();
        }

        // Builder State & Logic
        const builderSelections = {
            cpu: null,
            gpu: null,
            ram: null,
            storage: null,
            psu: null
        };

        const builderOptions = {
            cpu: [
                { name: "Intel Core i5-14400F", power: 65 },
                { name: "Intel Core i7-14700K", power: 125 },
                { name: "AMD Ryzen 5 7600X", power: 105 },
                { name: "AMD Ryzen 7 7800X3D", power: 120 }
            ],
            gpu: [
                { name: "NVIDIA GeForce RTX 4060", power: 115 },
                { name: "NVIDIA GeForce RTX 4070 Super", power: 220 },
                { name: "AMD Radeon RX 7800 XT", power: 263 }
            ],
            ram: [
                { name: "16GB (2x8GB) DDR5 5600MHz", power: 10 },
                { name: "32GB (2x16GB) DDR5 6000MHz", power: 15 }
            ],
            storage: [
                { name: "SSD 1TB NVMe Gen4", power: 5 },
                { name: "SSD 2TB NVMe Gen4", power: 8 }
            ],
            psu: [
                { name: "650W 80+ Bronze", power: 0 },
                { name: "750W 80+ Gold Modular", power: 0 },
                { name: "850W 80+ Gold Fully Modular", power: 0 }
            ]
        };

        function renderBuilderSlots() {
            const container = document.getElementById('builderSlots');
            if (!container) return;

            const slotLabels = {
                cpu: 'Prosesor (CPU)',
                gpu: 'Kartu Grafis (GPU)',
                ram: 'Memori (RAM)',
                storage: 'Penyimpanan (SSD)',
                psu: 'Power Supply (PSU)'
            };

            container.innerHTML = Object.keys(builderSelections).map(key => `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
                    <div>
                        <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">${slotLabels[key]}</span>
                        <h4 class="text-base font-bold text-slate-900 dark:text-white mt-0.5">${builderSelections[key] ? builderSelections[key].name : 'Belum dipilih'}</h4>
                    </div>
                    <select onchange="updateBuilderSelection('${key}', this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-sm rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                        <option value="">-- Pilih ${slotLabels[key]} --</option>
                        ${builderOptions[key].map((item, idx) => `
                            <option value="${idx}" ${builderSelections[key] && builderSelections[key].name === item.name ? 'selected' : ''}>${item.name} (${item.power > 0 ? item.power + 'W' : 'Power'})</option>
                        `).join('')}
                    </select>
                </div>
            `).join('');

            updateBuilderSummary();
        }

        function updateBuilderSelection(category, index) {
            if (index === "") {
                builderSelections[category] = null;
            } else {
                builderSelections[category] = builderOptions[category][index];
            }
            renderBuilderSlots();
        }

        function updateBuilderSummary() {
            const countEl = document.getElementById('summaryCount');
            const powerEl = document.getElementById('summaryPower');
            const psuRecEl = document.getElementById('summaryPsuRec');
            if (!countEl) return;

            let count = 0;
            let totalPower = 50;
            for (let key in builderSelections) {
                if (builderSelections[key]) {
                    count++;
                    totalPower += builderSelections[key].power;
                }
            }

            countEl.textContent = `${count} / 5`;
            powerEl.textContent = `${totalPower} Watt`;
            psuRecEl.textContent = `Minimal ${Math.ceil(totalPower * 1.3 / 50) * 50}W`;
        }

        function resetBuilder() {
            for (let key in builderSelections) {
                builderSelections[key] = null;
            }
            renderBuilderSlots();
            showToast("Rakitan berhasil direset.");
        }

        // Global Search Handler
        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) return;

            const found = Object.values(componentsData).find(c => c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
            if (found) {
                router.navigate('detail', found.id);
            }
        }

        // Filter Components on Home
        function filterComponents(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-700');
            });
            event.target.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-700');
            event.target.classList.add('bg-indigo-600', 'text-white');

            const grid = document.getElementById('componentsGrid');
            if (!grid) return;

            const list = Object.values(componentsData).filter(c => {
                if (category === 'all') return true;
                if (category === 'Processing') return c.category === 'Processing';
                return c.category !== 'Processing';
            });

            grid.innerHTML = list.map(comp => `
                <div onclick="router.navigate('detail', '${comp.id}')" class="group bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-900/90 border border-slate-200 dark:border-slate-800 hover:border-indigo-500/50 rounded-2xl p-6 transition-all duration-300 cursor-pointer shadow-lg hover:shadow-indigo-500/10 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-36 bg-slate-100 dark:bg-slate-950/50 rounded-xl mb-4 p-4 flex items-center justify-center border border-slate-200 dark:border-slate-800/50 group-hover:border-indigo-500/30 transition">
                            <div class="w-24 h-24 transform group-hover:scale-105 transition duration-300">
                                ${comp.svgIllustration}
                            </div>
                        </div>
                        <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">${comp.category}</span>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mt-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition">${comp.name}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${comp.tagline}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs font-semibold text-indigo-600 dark:text-indigo-400">
                        <span>Baca Penjelasan Detail</span>
                        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            `).join('');
        }

        // Toast Notification Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initial Load on Window Load
        window.onload = function() {
            initTheme();
            router.navigate('home');
            
            const originalNavigate = router.navigate;
            router.navigate = function(viewId, param) {
                originalNavigate(viewId, param);
                if (viewId === 'builder') {
                    renderBuilderSlots();
                } else if (viewId === 'quiz') {
                    loadQuizQuestion();
                }
            };
        };
    </script>
</body>
</html>
